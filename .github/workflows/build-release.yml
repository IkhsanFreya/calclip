name: CalClip.IN Windows Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies & Build Frontend
        run: |
          npm ci
          npm run build

      - name: 4. Compile Inno Setup Windows Installer (.exe)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss
          options: /O+

      - name: 5. Verify Output Installer
        run: |
          ls hasil-installer/

      - name: 6. Publish GitHub Release with Installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: hasil-installer/CalClip-v2.0-Windows-Setup.exe
          name: CalClip.IN ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
